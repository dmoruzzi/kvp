# Minimal OTLP receiver -> GrafanaCloud exporter.
# If GrafanaCloud vars are unset, falls back to file/stdout for local dev.
extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_STACK_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/grafana:
    endpoint: "https://otlp-gateway-${env:GRAFANA_CLOUD_REGION}.grafana.net/otlp"
    auth:
      authenticator: basicauth/grafana
  file/metrics:
    path: /tmp/metrics.jsonl
  debug:
    verbosity: basic

processors:
  batch: {}

service:
  extensions: [basicauth/grafana]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlphttp/grafana
        - debug
        - file/metrics
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlphttp/grafana
        - debug
