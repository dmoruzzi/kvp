# Minimal OTLP receiver -> GrafanaCloud exporter.
# If GrafanaCloud vars are unset, falls back to file/stdout for local dev.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/grafana:
    endpoint: "https://${env:GRAFANA_CLOUD_REGION}.grafana.net/otlp"
    headers:
      Authorization: "Basic ${env:GRAFANA_CLOUD_STACK_ID}:${env:GRAFANA_CLOUD_API_TOKEN}"
  file/metrics:
    path: /tmp/metrics.jsonl
  debug:
    verbosity: basic

processors:
  batch: {}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlphttp/grafana
        - debug
        - file/metrics
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlphttp/grafana
        - debug
