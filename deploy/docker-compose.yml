services:
  kvp:
    image: ghcr.io/dmoruzzi/kvp:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kvp_data:/app
    environment:
      KVP_PORT: ":8080"
      KVP_METRICS_PORT: "127.0.0.1:9090"
      KVP_DB_PATH: /app/kvp.db
      KVP_MAX_DB_BYTES: ${KVP_MAX_DB_BYTES:-1073741824}
      KVP_CLEANUP_BATCH_SIZE: ${KVP_CLEANUP_BATCH_SIZE:-1000}
      KVP_CLEANUP_MAX_RUNS: ${KVP_CLEANUP_MAX_RUNS:-20}
      KVP_SIZE_CLEANUP_THROTTLE: ${KVP_SIZE_CLEANUP_THROTTLE:-1m}
      KVP_CLEANUP_INTERVAL: ${KVP_CLEANUP_INTERVAL:-1m}
      KVP_MAX_BODY_BYTES: ${KVP_MAX_BODY_BYTES:-1048576}
      KVP_MAX_KEY_BYTES: ${KVP_MAX_KEY_BYTES:-256}
      KVP_TTL: ${KVP_TTL:-24h}
      KVP_RATE_LIMIT_RPS: ${KVP_RATE_LIMIT_RPS:-10}
      KVP_RATE_LIMIT_BURST: ${KVP_RATE_LIMIT_BURST:-20}
      KVP_API_KEY: ${KVP_API_KEY:-}
      # cloudflared peers from the kvp-net subnet below; trusting it lets kvp
      # resolve the real client IP from CF-Connecting-IP / X-Forwarded-For.
      KVP_TRUSTED_PROXIES: ${KVP_TRUSTED_PROXIES:-10.255.0.0/24}
      KVP_LOG_LEVEL: ${KVP_LOG_LEVEL:-info}
      KVP_OTEL_SERVICE_NAME: ${KVP_OTEL_SERVICE_NAME:-kvp}
      # The collector below is always part of the stack, so OTLP export is on
      # by default. GrafanaCloud exports are gated by GRAFANA_CLOUD_STACK_ID /
      # GRAFANA_CLOUD_API_TOKEN (empty => collector falls back to file/stdout).
      # kvp uses the HTTP/protobuf protocol, hence :4318 (4317 is gRPC).
      KVP_OTEL_EXPORTER_OTLP_ENDPOINT: ${KVP_OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4318}
      KVP_BACKUP_DIR: ${KVP_BACKUP_DIR:-}
      KVP_BACKUP_INTERVAL: ${KVP_BACKUP_INTERVAL:-6h}
      KVP_BACKUP_RETENTION: ${KVP_BACKUP_RETENTION:-5}
      KVP_SHUTDOWN_TIMEOUT: ${KVP_SHUTDOWN_TIMEOUT:-15s}
      GRAFANA_CLOUD_STACK_ID: ${GRAFANA_CLOUD_STACK_ID:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
      GRAFANA_CLOUD_REGION: ${GRAFANA_CLOUD_REGION:-}
    networks:
      - kvp-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/hc"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      kvp:
        condition: service_healthy
    command: tunnel run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required in .env}
    environment:
      NO_AUTOUPDATE: "true"
    networks:
      - kvp-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector.yaml"]
    tmpfs:
      - /tmp
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    environment:
      GRAFANA_CLOUD_STACK_ID: ${GRAFANA_CLOUD_STACK_ID:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
      GRAFANA_CLOUD_REGION: ${GRAFANA_CLOUD_REGION:-}
    depends_on:
      kvp:
        condition: service_healthy
    networks:
      - kvp-net

  # Laptop-only debugging: standalone Prometheus scraping /metrics (127.0.0.1:9090).
  prometheus:
    image: prom/prometheus:latest
    profiles: ["local-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

networks:
  # Fixed subnet so KVP_TRUSTED_PROXIES can be stable across restarts;
  # Docker otherwise assigns the cloudflared IP dynamically per network.
  kvp-net:
    ipam:
      config:
        - subnet: 10.255.0.0/24

volumes:
  kvp_data:
