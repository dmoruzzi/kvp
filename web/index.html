<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVP Store</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
  <header>
    <div class="badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6l1 7-4 2-4-2 1-7Z"/>
        <path d="M12 12v3"/>
        <path d="M8.5 17l1.5 4h4l1.5-4"/>
      </svg>
    </div>
    <div>
      <h1>KVP Store</h1>
      <p class="tagline">A small key&#8211;value store with built-in TTL expiry.</p>
    </div>
  </header>

  <div class="workspace">
    <section class="card">
      <h2>Request</h2>
      <label for="key">Key</label>
      <input id="key" name="key" autocomplete="off" placeholder="e.g. config/env" value="config">
      <label for="apikey">API key (required if the server sets KVP_API_KEY)</label>
      <input id="apikey" name="apikey" type="password" autocomplete="off" placeholder="X-API-Key value">
      <label for="value">Value (POST only)</label>
      <textarea id="value" name="value" placeholder="value to store"></textarea>
      <div class="field-hint"><span></span><span class="count" id="counter">0 B</span></div>
      <div class="actions">
        <button type="button" class="primary" id="put">PUT /key</button>
        <button type="button" id="get">GET /key</button>
      </div>
    </section>

    <section class="card">
      <div class="result-head">
        <h2>Result</h2>
        <span class="status" id="status"></span>
        <button type="button" class="mini" id="copy">Copy</button>
      </div>
      <div class="terminal">
        <div class="terminal-bar">
          <span class="t1"></span><span class="t2"></span><span class="t3"></span>
          <span class="tpath">kvp</span>
        </div>
        <pre id="result" class="meta">Ready.</pre>
      </div>
    </section>
  </div>

  <footer>
    Endpoints:
    <code>GET /&lt;key&gt;</code> reads a value
    <span class="sep">&middot;</span>
    <code>POST /&lt;key&gt;</code> stores it with the server TTL.
  </footer>
</main>
<script src="/app.js"></script>
</body>
</html>
